services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: poc
      POSTGRES_PASSWORD: poc
      POSTGRES_DB: nuits_garonne
    # Expose uniquement en local (pour `npm run dev`), pas sur le reseau.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poc -d nuits_garonne"]
      interval: 2s
      timeout: 5s
      retries: 30

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://poc:poc@postgres:5432/nuits_garonne?schema=public
      QR_SECRET: ${QR_SECRET:-dev-secret-change-me}
      MAX_TICKETS_PER_EMAIL: ${MAX_TICKETS_PER_EMAIL:-4}
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres-data:
